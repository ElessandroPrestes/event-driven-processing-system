x-eventflow-runtime-env: &eventflow-runtime-env
  COMPOSER_HOME: /tmp/composer
  APP_ENV: docker
  APP_URL: "http://localhost:${APP_PORT:-8080}"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: eventflow-app
    working_dir: /var/www/html
    environment:
      <<: *eventflow-runtime-env
      RUN_MIGRATIONS: "true"
    env_file:
      - .env.docker
    entrypoint:
      - /usr/local/bin/docker-entrypoint.sh
    command:
      - php
      - artisan
      - serve
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "${APP_PORT:-8080}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: eventflow-worker
    working_dir: /var/www/html
    environment:
      <<: *eventflow-runtime-env
      RUN_MIGRATIONS: "false"
    env_file:
      - .env.docker
    entrypoint:
      - /usr/local/bin/docker-entrypoint.sh
    command:
      - php
      - artisan
      - events:consume
      - --idle-timeout=5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: eventflow-postgres
    environment:
      POSTGRES_DB: "${DB_DATABASE:-eventflow}"
      POSTGRES_USER: "${DB_USERNAME:-eventflow}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    ports:
      - "${POSTGRES_PORT_FORWARD:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-eventflow} -d ${DB_DATABASE:-eventflow}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: eventflow-redis
    ports:
      - "${REDIS_PORT_FORWARD:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: eventflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-eventflow}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-secret}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-/}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
