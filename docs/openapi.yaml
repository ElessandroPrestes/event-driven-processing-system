openapi: 3.1.0
info:
  title: eventflow-platform API
  version: 0.9.0
  description: API para recepcao, processamento assincrono, operacao, historico, autenticacao por chave, rate limit por escopo, correlacao por trace_id, exportacao de metricas e operacao da DLQ.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      summary: Verifica a readiness operacional da aplicacao e do pipeline assincrono
      responses:
        '200':
          description: Aplicacao pronta para operar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Algum componente obrigatorio do pipeline esta degradado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/metrics:
    get:
      summary: Exporta metricas operacionais em formato Prometheus
      security:
        - OperationsApiKey: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Metricas operacionais exportadas
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Chave de API invalida
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/events:
    get:
      summary: Lista eventos recebidos e processados
      security:
        - OperationsApiKey: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - in: query
          name: status
          required: false
          schema:
            type: string
            example: processed,processing_failed
        - in: query
          name: event_name
          required: false
          schema:
            type: string
        - in: query
          name: trace_id
          required: false
          schema:
            type: string
            maxLength: 128
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Lista paginada de eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Chave de API invalida
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      summary: Recebe um novo evento e o publica no RabbitMQ
      security:
        - IngestApiKey: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreEventRequest'
      responses:
        '202':
          description: Evento aceito e enfileirado
        '200':
          description: Evento duplicado retornado por idempotencia
        '409':
          description: Chave de idempotencia reutilizada com payload diferente
        '422':
          description: Payload invalido
        '401':
          description: Chave de API invalida
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Falha ao publicar o evento no RabbitMQ
  /api/v1/events/summary:
    get:
      summary: Retorna um resumo operacional do pipeline de eventos
      security:
        - OperationsApiKey: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - in: query
          name: event_name
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Resumo operacional calculado
        '401':
          description: Chave de API invalida
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/quarantine:
    get:
      summary: Lista uma amostra da dead-letter queue operacional
      security:
        - OperationsApiKey: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Snapshot da quarentena
        '401':
          description: Chave de API invalida
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/quarantine/replay:
    post:
      summary: Republica mensagens da dead-letter queue para a fila principal
      security:
        - OperationsApiKey: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 1
                message_ids:
                  type: array
                  maxItems: 50
                  items:
                    type: string
              description: Informe `limit` para replay em lote ou `message_ids` para replay direcionado.
      responses:
        '202':
          description: Replay da quarentena executado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      replayed_count:
                        type: integer
                        minimum: 0
                      requested:
                        type: integer
                        minimum: 1
                      remaining_depth:
                        type: integer
                        minimum: 0
                      stopped_reason:
                        type: string
                        nullable: true
                      missing_message_ids:
                        type: array
                        items:
                          type: string
                      messages:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
        '401':
          description: Chave de API invalida
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Falha ao reenfileirar mensagens da quarentena
  /api/v1/events/{id}:
    get:
      summary: Consulta um evento recebido pelo identificador
      security:
        - OperationsApiKey: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Evento encontrado
        '401':
          description: Chave de API invalida
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          description: Evento nao encontrado
  /api/v1/events/{id}/history:
    get:
      summary: Lista o historico cronologico paginado de transicoes e acoes de um evento
      security:
        - OperationsApiKey: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Historico paginado do evento
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Chave de API invalida
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          description: Evento nao encontrado
  /api/v1/events/{id}/retry:
    post:
      summary: Reenfileira manualmente um evento com falha de publicacao ou processamento
      security:
        - OperationsApiKey: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Evento reenfileirado com sucesso
        '401':
          description: Chave de API invalida
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          description: Evento nao encontrado
        '409':
          description: Evento em estado nao reenfileiravel
        '503':
          description: Falha ao reenfileirar o evento no RabbitMQ
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            service:
              type: string
            status:
              type: string
              enum: [ok, degraded]
            ready:
              type: boolean
            timestamp:
              type: string
              format: date-time
            checks:
              type: object
              additionalProperties:
                type: object
                properties:
                  status:
                    type: string
                  observed_at:
                    type: string
                    format: date-time
                  message:
                    type: string
                    nullable: true
                  details:
                    type: object
                    additionalProperties: true
    RateLimitError:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: Limite de requisicoes excedido para este escopo da API.
        data:
          type: object
          required:
            - scope
            - limit
            - retry_after_seconds
          properties:
            scope:
              type: string
              enum:
                - ingest
                - operations
            limit:
              type: integer
              minimum: 1
            retry_after_seconds:
              type: integer
              minimum: 1
    PaginationMeta:
      type: object
      required:
        - count
        - current_page
        - per_page
        - total
        - last_page
        - has_more_pages
      properties:
        count:
          type: integer
          minimum: 0
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
        has_more_pages:
          type: boolean
    StoreEventRequest:
      type: object
      required:
        - event_name
        - payload
      properties:
        event_name:
          type: string
          example: user.created
        payload:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        occurred_at:
          type: string
          format: date-time
  parameters:
    TraceIdHeader:
      in: header
      name: X-Trace-Id
      required: false
      schema:
        type: string
        maxLength: 128
  securitySchemes:
    IngestApiKey:
      type: apiKey
      in: header
      name: X-Ingest-Api-Key
    OperationsApiKey:
      type: apiKey
      in: header
      name: X-Operations-Api-Key
  responses:
    TooManyRequests:
      description: Limite de requisicoes excedido para o escopo autenticado
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
        X-RateLimit-Limit:
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Remaining:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
      type: object
      required:
        - event_name
        - payload
      properties:
        event_name:
          type: string
          enum:
            - user.created
            - payment.received
            - invoice.generated
            - notification.requested
        payload:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
